---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
    - repo: https://github.com/camunda/infraex-common-config
      rev: 2.3.6 # use tags until renovate supports sha: https://github.com/renovatebot/renovate/issues/22567
      hooks:
          - id: update-action-readmes-docker

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-added-large-files

    - repo: https://github.com/rhysd/actionlint
      rev: v1.7.12
      hooks:
          - id: actionlint
            # The second ignore covers the `job` context's workflow identity properties
            # (`job.workflow_sha`, `job.workflow_repository`, `job.workflow_ref`,
            # `job.workflow_file_path`). They are documented, and lint-global uses the first
            # two to check itself out by the commit it was resolved from, but actionlint
            # 1.7.12 still types the `job` context without them and rejects the expression.
            # Drop this once actionlint knows about them.
            args: [-ignore=SC2155, -ignore=property "workflow_(sha|repository|ref|file_path)" is not defined]

    - repo: https://github.com/renovatebot/pre-commit-hooks
      rev: 44.39.2
      hooks:
          - id: renovate-config-validator
            # --no-global is required: when the CLI is handed filenames it defaults to
            # validating them as self-hosted global config, which silently accepts
            # global-only options that a repo or preset must never carry.
            args: [--strict, --no-global]
            # The upstream pattern only matches renovate/renovaterc filenames, so
            # default.json5 -- the preset every consumer repository extends -- was
            # never validated. Keep the upstream alternative verbatim and add ours.
            files: (^|/).?renovate(?:rc)?(?:\.json5?)?$|^default\.json5$

    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.3
      hooks:
          - id: yamlfmt

    - repo: https://github.com/zizmorcore/zizmor-pre-commit
      rev: v1.29.0
      hooks:
          # Static analysis of GitHub Actions workflows and actions.
          # Threshold is `high` because the repository still carries ~30 medium and ~55
          # low/informational findings; see the burn-down issue before lowering it.
          # Without GH_TOKEN zizmor runs offline, which skips known-vulnerable-actions,
          # impostor-commit, ref-confusion, ref-version-mismatch and stale-action-refs.
          # None of those currently report anything at `high`.
          #
          # --config makes the pinning policy explicit in .github/zizmor.yml rather than
          # leaving it to zizmor's defaults. The repository is already fully SHA-pinned,
          # so this changes no finding today; it stops a future default change from
          # silently dropping `unpinned-uses` below the `high` threshold above.
          - id: zizmor
            args: [--no-progress, --min-severity=high, --config=.github/zizmor.yml]
