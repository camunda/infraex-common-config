---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
    - repo: https://github.com/camunda/infraex-common-config
      rev: 2.0.1 # use tags until renovate supports sha: https://github.com/renovatebot/renovate/issues/22567
      hooks:
          - id: update-action-readmes-docker

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-added-large-files

    - repo: https://github.com/rhysd/actionlint
      rev: v1.7.12
      hooks:
          - id: actionlint
            args: [-ignore=SC2155]

    - repo: https://github.com/renovatebot/pre-commit-hooks
      rev: 43.288.0
      hooks:
          - id: renovate-config-validator
            # --no-global is required: when the CLI is handed filenames it defaults to
            # validating them as self-hosted global config, which silently accepts
            # global-only options that a repo or preset must never carry.
            args: [--strict, --no-global]
            # The upstream pattern only matches renovate/renovaterc filenames, so
            # default.json5 -- the preset every consumer repository extends -- was
            # never validated. Keep the upstream alternative verbatim and add ours.
            files: (^|/).?renovate(?:rc)?(?:\.json5?)?$|^default\.json5$
            # TODO : revert this when https://github.com/renovatebot/pre-commit-hooks/issues/2460 is fixed
            language_version: lts

    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.3
      hooks:
          - id: yamlfmt

    - repo: https://github.com/zizmorcore/zizmor-pre-commit
      rev: v1.29.0
      hooks:
          # Static analysis of GitHub Actions workflows and actions.
          # Threshold is `high` because the repository still carries ~30 medium and ~55
          # low/informational findings; see the burn-down issue before lowering it.
          # Without GH_TOKEN zizmor runs offline, which skips known-vulnerable-actions,
          # impostor-commit, ref-confusion, ref-version-mismatch and stale-action-refs.
          # None of those currently report anything at `high`.
          - id: zizmor
            args: [--no-progress, --min-severity=high]
