---
    - id: update-action-readmes-docker
      name: Update GitHub Action READMEs
      entry: ./pre_commit_hooks/docker_update_action_readmes.sh
      language: script
    # Only runs when action files are modified
      files: ^\.github/actions/.+\.(yml|yaml)$
      pass_filenames: false # ensure single run

    - id: action-pin-spacing
      name: Exactly one space before the version comment of a pinned action
      description: >-
          The dependency-guard action-pin rule matches `@<sha> # <version>` with one space.
          Any other spacing makes the scanner veto every Renovate pin update on that line.
      language: pygrep
      entry: uses:\s*\S+@[0-9a-f]{40}(\s{2,}|\t)#
      files: ^\.github/(workflows/[^/]+|actions/.+/action)\.ya?ml$
