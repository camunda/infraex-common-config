---
# desc: publish a semver GitHub Release when main has commits since the last published release
name: Release

# Patch bump on schedule; pick the bump by hand through workflow_dispatch for minor/major releases.
# Consumers pin this repository by release SHA, so a change only reaches them once it is released.

on:
    schedule:
        - cron: 17 9 * * 1-5
    workflow_dispatch:
        inputs:
            bump:
                description: Version part to bump
                type: choice
                options: [patch, minor, major]
                default: patch
            dry_run:
                description: Compute the next version without publishing
                type: boolean
                default: false

concurrency:
    group: release
    cancel-in-progress: false

# Every write goes through the GitHub App token: `*.*.*` tags are protected by the
# `Tag Protection: tsemver` ruleset, which GITHUB_TOKEN cannot bypass.
permissions:
    contents: read

jobs:
    release:
        # release-global mints the App token after a Vault OIDC/JWT login.
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/release-global.yml
        with:
            bump: ${{ inputs.bump || 'patch' }}
            dry-run: ${{ inputs.dry_run || false }}
            app-token: true
        secrets:
            VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
            VAULT_JWT_PATH: ${{ secrets.VAULT_JWT_PATH }}
            VAULT_JWT_ROLE: ${{ secrets.VAULT_JWT_ROLE }}
            VAULT_JWT_AUDIENCE: ${{ secrets.VAULT_JWT_AUDIENCE }}

    notify-on-failure:
        runs-on: ubuntu-latest
        if: failure() && github.event_name == 'schedule'
        # `report-failure-on-slack` reads the open `silence: <workflow>` issues to decide whether
        # the alert is muted; without `issues: read` it alerts anyway.
        permissions:
            contents: read
            issues: read
            id-token: write # Vault OIDC/JWT auth
        needs:
            - release
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Notify in Slack in case of failure
              uses: ./.github/actions/report-failure-on-slack
              with:
                  vault_addr: ${{ secrets.VAULT_ADDR }}
                  vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
                  vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
                  vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
