---
name: test-planner

# Unit tests of the test-selection planner (standard library only, no network).

on:
    pull_request:
        paths:
            - .github/workflows/scripts/planner/**
            - .github/workflows/planner*.yml
            - .github/actions/planner-gate/**
            - .github/workflows/test-planner.yml
    push:
        branches: [main]
        paths:
            - .github/workflows/scripts/planner/**

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Unit tests
              run: |
                  set -euo pipefail
                  cd .github/workflows/scripts
                  python3 -m unittest discover -s planner/tests -t . -v
