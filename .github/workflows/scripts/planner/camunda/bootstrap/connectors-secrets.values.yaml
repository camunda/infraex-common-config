# Helm values for the Camunda chart: the planner's connector secrets on the connectors runtime. The BPMN reads them
# as {{secrets.PLANNER_ES_URL}} and {{secrets.PLANNER_ES_APIKEY}}; the runtime exposes environment variables with
# the prefix SECRET_ as connector secrets. Create the Kubernetes secret first (the key comes from es-bootstrap.sh):
#   kubectl create secret generic planner-es-credentials -n <namespace> \
#     --from-literal=url=https://<elasticsearch>:<port> --from-file=apikey=<KEY_FILE>
# `connectors.env` replaces the chart's list: merge these two entries into the env list the release already has.
connectors:
    env:
        - name: SECRET_PLANNER_ES_URL
          valueFrom:
              secretKeyRef:
                  name: planner-es-credentials
                  key: url
        - name: SECRET_PLANNER_ES_APIKEY
          valueFrom:
              secretKeyRef:
                  name: planner-es-credentials
                  key: apikey
