---
name: crev-review-global

on:
    workflow_call:
        inputs:
            model:
                description: >-
                    OpenRouter model ID that the crev agents use, for example `deepseek/deepseek-v4.1-flash`.
                    The Camunda OpenRouter workspace must serve it on `openrouter-base-url`.
                required: true
                type: string
            verifier-model:
                description: >-
                    OpenRouter model ID for the crev verifier, for example `z-ai/glm-5.3`. Empty means `model`.
                    The Camunda OpenRouter workspace must serve it on `openrouter-base-url`.
                default: ''
                type: string
            openrouter-base-url:
                description: >-
                    OpenRouter host that serves the model. The Camunda workspace serves each model on
                    either the US or the EU host.
                default: https://us.openrouter.ai/api/v1
                type: string
            crev-image:
                description: >-
                    crev container image. Pin it by `sha-` tag or digest. The image must support
                    `crev --from-review`.
                default: ghcr.io/camunda/crev:sha-99499dd@sha256:d0b8c19f15cc5869e800954aa6d8720e17478066f10cc4f43a82586c6b3f14ec
                type: string
            vault-secret-path:
                description: Vault path that holds the OpenRouter key and that the Vault role can read.
                default: secret/data/products/smx/ci/openrouter
                type: string
            vault-openrouter-key:
                description: Key of the OpenRouter API key in the Vault secret.
                default: OPENROUTER_API_KEY
                type: string
        secrets:
            VAULT_ADDR:
                description: Vault server URL. Optional; the default is `https://vault.int.camunda.com`.
                required: false
            VAULT_JWT_PATH:
                description: Vault auth backend path for GitHub OIDC (JWT) authentication. Optional; the default is `github-actions-camunda`.
                required: false
            VAULT_JWT_ROLE:
                description: Vault role for GitHub OIDC (JWT) authentication. Optional; the default is `github-actions-smx-ci`.
                required: false
            VAULT_JWT_AUDIENCE:
                description: GitHub OIDC audience for Vault (JWT) authentication. Optional; the default is `camunda-vault`.
                required: false

permissions: {}

jobs:
    guard:
        name: Check the review request
        if: github.event.issue.pull_request && (github.event.comment.body == '/crev' || startsWith(github.event.comment.body, '/crev '))
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            issues: write
            pull-requests: read
        outputs:
            pr-url: ${{ steps.pr.outputs.url }}
            head-sha: ${{ steps.pr.outputs.head-sha }}
        steps:
            - name: Check the commenter's role
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  COMMENTER: ${{ github.event.comment.user.login }}
              run: |
                  set -euo pipefail
                  permission=$(gh api "repos/${REPO}/collaborators/${COMMENTER}/permission")
                  if ! jq -e '.user.permissions | .triage or .push or .maintain or .admin' <<<"${permission}" > /dev/null; then
                    echo "::error::${COMMENTER} has the role '$(jq -r .role_name <<<"${permission}")' on ${REPO}; /crev needs triage or a higher role."
                    exit 1
                  fi

            - name: Resolve the pull request
              id: pr
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  NUMBER: ${{ github.event.issue.number }}
              run: |
                  set -euo pipefail
                  pr=$(gh api "repos/${REPO}/pulls/${NUMBER}")
                  head_repo=$(jq -r '.head.repo.full_name' <<<"${pr}")
                  if [ "${head_repo}" != "${REPO}" ]; then
                    echo "::error::The head of #${NUMBER} is in '${head_repo}'; /crev reviews only pull requests from branches of ${REPO}."
                    exit 1
                  fi
                  {
                    echo "url=$(jq -r '.html_url' <<<"${pr}")"
                    echo "head-sha=$(jq -r '.head.sha' <<<"${pr}")"
                  } >> "${GITHUB_OUTPUT}"

            - name: Show that the review started
              continue-on-error: true
              timeout-minutes: 1
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  COMMENT_ID: ${{ github.event.comment.id }}
              run: gh api -X POST "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content=eyes --silent

    secrets:
        name: Wrap the OpenRouter key
        needs: guard
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            id-token: write
        outputs:
            wrap-token: ${{ steps.wrap.outputs.wrap-token }}
        steps:
            - name: Wrap the OpenRouter key from Vault
              id: wrap
              uses: camunda/infra-global-github-actions/vault-wrapped-secrets/wrap@6644ac7ceab8e1b32359cc25a5161c46156fc319 # vault-wrapped-secrets-1.0.1
              with:
                  vault-url: ${{ secrets.VAULT_ADDR || 'https://vault.int.camunda.com' }}
                  vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH || 'github-actions-camunda' }}
                  vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE || 'github-actions-smx-ci' }}
                  vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE || 'camunda-vault' }}
                  secrets: |
                      ${{ inputs.vault-secret-path }} ${{ inputs.vault-openrouter-key }} | OPENROUTER_API_KEY;

    review:
        name: Review with crev
        needs: [guard, secrets]
        concurrency:
            group: ${{ github.workflow }}-review-${{ github.event.issue.number }}
            cancel-in-progress: true
        runs-on: ubuntu-latest
        timeout-minutes: 120
        permissions:
            contents: read
            packages: read
            pull-requests: read
        steps:
            - name: Unwrap the OpenRouter key
              id: vault
              uses: camunda/infra-global-github-actions/vault-wrapped-secrets/unwrap@6644ac7ceab8e1b32359cc25a5161c46156fc319 # vault-wrapped-secrets-1.0.1
              with:
                  vault-url: ${{ secrets.VAULT_ADDR || 'https://vault.int.camunda.com' }}
                  wrap-token: ${{ needs.secrets.outputs.wrap-token }}

            - name: Write the OpenCode provider and crev profile configuration
              env:
                  MODEL: ${{ inputs.model }}
                  VERIFIER_MODEL: ${{ inputs.verifier-model || inputs.model }}
                  BASE_URL: ${{ inputs.openrouter-base-url }}
              run: |
                  set -euo pipefail
                  mkdir -p "${RUNNER_TEMP}/opencode" "${RUNNER_TEMP}/crev"
                  jq -n --arg url "${BASE_URL}" --arg model "${MODEL}" --arg verifier "${VERIFIER_MODEL}" '{
                    "$schema": "https://opencode.ai/config.json",
                    "disabled_providers": ["openrouter"],
                    "provider": {
                      "openrouter-camunda": {
                        "name": "OpenRouter Camunda",
                        "npm": "@ai-sdk/openai-compatible",
                        "options": {"baseURL": $url, "apiKey": "{env:OPENROUTER_API_KEY}"},
                        "models": {($model): {"name": $model}, ($verifier): {"name": $verifier}}
                      }
                    }
                  }' > "${RUNNER_TEMP}/opencode/opencode.json"
                  jq -n --arg model "openrouter-camunda/${MODEL}" --arg verifier "openrouter-camunda/${VERIFIER_MODEL}" '{
                    current: "ci",
                    profiles: {ci: {backend: "opencode", model: $model, models: {verifier: $verifier}}}
                  }' > "${RUNNER_TEMP}/crev/profiles.yaml"
                  chmod -R a+rwX "${RUNNER_TEMP}/opencode" "${RUNNER_TEMP}/crev"

            - name: Log in to GHCR
              env:
                  GH_TOKEN: ${{ github.token }}
                  ACTOR: ${{ github.actor }}
              run: docker login ghcr.io --username "${ACTOR}" --password-stdin <<<"${GH_TOKEN}"

            - name: Review the pull request
              env:
                  GH_TOKEN: ${{ github.token }}
                  OPENROUTER_API_KEY: ${{ fromJSON(steps.vault.outputs.secrets).OPENROUTER_API_KEY }}
                  CREV_IMAGE: ${{ inputs.crev-image }}
                  PR_URL: ${{ needs.guard.outputs.pr-url }}
              run: |
                  set -euo pipefail
                  mkdir -p "${RUNNER_TEMP}/crev-review"
                  docker run --rm \
                    -e GH_TOKEN -e OPENROUTER_API_KEY -e CREV_NO_UPDATE_CHECK=1 \
                    -v "${RUNNER_TEMP}/opencode:/home/node/.config/opencode" \
                    -v "${RUNNER_TEMP}/crev:/home/node/.config/crev" \
                    "${CREV_IMAGE}" "${PR_URL}" \
                    --single --dry-run --json --no-cache --profile ci \
                    > "${RUNNER_TEMP}/crev-review/review.json"

            - name: Check that the review is for the requested head
              env:
                  HEAD_SHA: ${{ needs.guard.outputs.head-sha }}
              run: |
                  set -euo pipefail
                  if ! jq -e --arg head "${HEAD_SHA}" 'any(.changeset[]; .head == $head)' "${RUNNER_TEMP}/crev-review/review.json" > /dev/null; then
                    echo "::error::The pull request changed after /crev; the review is not for ${HEAD_SHA}."
                    exit 1
                  fi

            - name: Store the review
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: crev-review
                  path: ${{ runner.temp }}/crev-review/review.json
                  retention-days: 7
                  if-no-files-found: error

    publish:
        name: Post the review
        needs: [guard, review]
        concurrency:
            group: ${{ github.workflow }}-publish-${{ github.event.issue.number }}
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write
            packages: read
            pull-requests: write
            statuses: write
        steps:
            - name: Download the review
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: crev-review
                  path: ${{ runner.temp }}/crev-review

            - name: Log in to GHCR
              env:
                  GH_TOKEN: ${{ github.token }}
                  ACTOR: ${{ github.actor }}
              run: docker login ghcr.io --username "${ACTOR}" --password-stdin <<<"${GH_TOKEN}"

            - name: Post the review
              env:
                  GH_TOKEN: ${{ github.token }}
                  CREV_IMAGE: ${{ inputs.crev-image }}
                  PR_URL: ${{ needs.guard.outputs.pr-url }}
              run: |
                  set -euo pipefail
                  docker run --rm \
                    -e GH_TOKEN -e CREV_NO_UPDATE_CHECK=1 \
                    -v "${RUNNER_TEMP}/crev-review/review.json:/tmp/review.json:ro" \
                    "${CREV_IMAGE}" "${PR_URL}" \
                    --single --from-review /tmp/review.json --post --review-event comment

    report:
        name: Report a failed review
        needs: [guard, review, publish]
        if: failure() && needs.guard.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            pull-requests: write
        steps:
            - name: Comment on the pull request
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_URL: ${{ needs.guard.outputs.pr-url }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  gh pr comment "${PR_URL}" --body "crev could not finish this review: ${RUN_URL}. Comment \`/crev\` again to start a new review. Re-running the failed jobs does not work: the OpenRouter key handover can be used only once."
