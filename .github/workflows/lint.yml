---
name: pre-commit

on:
    pull_request:
    push:
        branches: [main]

jobs:
    lint:
        permissions:
            contents: read
            id-token: write # Vault OIDC/JWT auth of the auto-fix job
        uses: ./.github/workflows/lint-global.yml
        with:
            check-renovate-lookup: true
            autofix-actor: kellervater
        secrets: inherit
