---
name: Azure Scheduled Cleanup of test regions

permissions:
    contents: read

on:
    schedule:
        # Single daily schedule at 5:00
        - cron: 0 5 * * *
    workflow_dispatch:
        inputs:
            region:
                description: Azure region to clean up
                default: swedencentral
            cleanup_older_than:
                description: Minimum age of the resources to cleanup
                default: 12h

    pull_request:
        paths:
            - .github/workflows/azure_nightly_cleanup.yml
            - .github/workflows/scripts/azure_rg_cleanup.sh
            - .github/workflows/scripts/tests/**

# Limit workflow to a single execution per ref
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # The sweep runs against a stubbed CLI here. On pull requests the real job
    # below is forced into DRY_RUN, so it never deletes anything and never
    # reaches the deletion or verification paths; this is what covers them.
    sweep-tests:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Run the resource group sweep tests
              run: |
                  ./.github/workflows/scripts/tests/azure_rg_cleanup_test.sh

    azure-cleanup:
        runs-on: ubuntu-latest
        needs:
            - sweep-tests
        # The suite gates the pull request, not the nightly run. On a pull
        # request it is reviewing a change to the sweep, so a red suite must
        # stop it. On a schedule the code has already been through that gate and
        # has not changed since, so the only thing a red suite can do is cost a
        # night of cleanup — it does not block the sweep. notify-on-failure
        # depends on both jobs, so a red suite is still reported either way.
        #
        # Written as a condition rather than an `if` on sweep-tests itself so no
        # job is ever skipped: a skipped dependency has its own propagation
        # rules, and the Slack alert is not the place to rely on them.
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.sweep-tests.result == 'success') }}
        # `azure/login` authenticates with OIDC, so this job — and only this job — needs to
        # mint an OIDC token. Vault is reached with AppRole, which needs no extra permission.
        permissions:
            contents: read
            id-token: write
        strategy:
            fail-fast: false # don't propagate failing jobs
            matrix:
                # Define regions and types of cleanup based on day
                # Please also update the README.md of the project
                config:
                    - region: swedencentral
                      day: All
                      cleanup_older_than: 12h
                    - region: spaincentral
                      day: Saturday
                      cleanup_older_than: 0h

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Determine AZURE_REGION and CLEANUP_OLDER_THAN
              id: determine-values
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      AZURE_REGION="${GITHUB_EVENT_INPUTS_REGION}"
                      CLEANUP_OLDER_THAN="${GITHUB_EVENT_INPUTS_CLEANUP_OLDER_THAN}"
                  else
                      AZURE_REGION="${{ matrix.config.region }}"
                      CLEANUP_OLDER_THAN="${{ matrix.config.cleanup_older_than }}"
                  fi

                  echo "AZURE_REGION=$AZURE_REGION" | tee -a "$GITHUB_ENV"
                  echo "CLEANUP_OLDER_THAN=$CLEANUP_OLDER_THAN" | tee -a "$GITHUB_ENV"
              env:
                  GITHUB_EVENT_INPUTS_REGION: ${{ github.event.inputs.region }}
                  GITHUB_EVENT_INPUTS_CLEANUP_OLDER_THAN: ${{ github.event.inputs.cleanup_older_than }}

            - name: Check if job should run based on the day
              id: day-check
              run: |
                  # Initialize a variable to determine if the job should continue
                  should_run=true

                  # If it's a workflow_dispatch, only allow the first region (swedencentral) of the matrix to run
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      if [[ "${{ matrix.config.region }}" != "swedencentral" ]]; then
                          echo "Skipping job for this region because only the first region is allowed to run for workflow_dispatch."
                          should_run=false
                      else
                          echo "Running job for the first region only since it's a workflow_dispatch event."
                      fi
                  else
                      # Otherwise, check if the day matches the one in the matrix
                      current_day=$(date +%A)
                      if [[ "${{ matrix.config.day }}" != "All" && "${{ matrix.config.day }}" != "$current_day" ]]; then
                          echo "Skipping job for region ${{ env.AZURE_REGION }} as it’s intended for ${{ matrix.config.day }} only."
                          should_run=false
                      else
                          echo "Running job for region ${{ env.AZURE_REGION }} on the correct day: $current_day."
                      fi
                  fi

                  echo "should_run=$should_run" | tee -a "$GITHUB_ENV"


            # For PR purposes we're overwriting the setting and enable dry run
            - name: Set DRY_RUN for PR
              if: github.event_name == 'pull_request'
              run: |
                  echo "DRY_RUN=true" | tee -a "$GITHUB_ENV"
                  echo "should_run=true" | tee -a "$GITHUB_ENV"

            - name: Import Secrets
              if: ${{ env.should_run == 'true' }}
              id: secrets
              uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
              with:
                  url: ${{ secrets.VAULT_ADDR }}
                  method: approle
                  roleId: ${{ secrets.VAULT_ROLE_ID }}
                  secretId: ${{ secrets.VAULT_SECRET_ID }}
                  exportEnv: true
                  secrets: |
                      secret/data/products/infrastructure-experience/ci/common AZURE_CLIENT_ID;
                      secret/data/products/infrastructure-experience/ci/common AZURE_TENANT_ID;
                      secret/data/products/infrastructure-experience/ci/common AZURE_SUBSCRIPTION_ID;

            - name: Azure Login with OIDC
              if: ${{ env.should_run == 'true' }}
              uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
              with:
                  client-id: ${{ steps.secrets.outputs.AZURE_CLIENT_ID }}
                  tenant-id: ${{ steps.secrets.outputs.AZURE_TENANT_ID }}
                  subscription-id: ${{ steps.secrets.outputs.AZURE_SUBSCRIPTION_ID }}

            - name: Run Azure Cleanup Script
              if: ${{ env.should_run == 'true' }}
              id: azure-cleanup
              run: |
                  ./.github/workflows/scripts/azure_rg_cleanup.sh


    notify-on-failure:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # The Slack action checks for an open "silence: <workflow>" issue in this
            # repository before alerting, and reads it with this token.
            issues: read
        if: failure()
        needs:
            - sweep-tests
            - azure-cleanup
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Notify in Slack in case of failure
              id: slack-notification
              if: github.event_name == 'schedule'
              uses: ./.github/actions/report-failure-on-slack
              with:
                  vault_addr: ${{ secrets.VAULT_ADDR }}
                  vault_role_id: ${{ secrets.VAULT_ROLE_ID }}
                  vault_secret_id: ${{ secrets.VAULT_SECRET_ID }}
