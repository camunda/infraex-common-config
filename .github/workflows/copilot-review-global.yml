---
name: copilot-review-global

on:
    workflow_call:
        inputs:
            skip-authors:
                description: >-
                    JSON array of pull request author logins that never get an automatic Copilot
                    review. The `ai-review` label still requests one on their pull requests.
                default: '["renovate[bot]", "dependabot[bot]", "smx-misc[bot]"]'
                type: string
            slack-channel-id:
                description: >-
                    Slack channel notified when the review request fails. Empty selects
                    #team-smx-alerts (with an @smx-medic mention), or #team-smx-test for pull
                    requests from a `schedules/*` branch.
                    `none` disables the notification, and the Vault secrets are then not needed.
                default: ''
                type: string
            vault-secret-path:
                description: >-
                    Vault path holding the Slack bot token for the failure notification. Callers
                    outside InfraEx must use their own team's secret.
                default: secret/data/products/infrastructure-experience/ci/common
                type: string
            vault-slack-token-key:
                description: Key of the Slack bot token in the Vault secret.
                default: SLACK_BOT_TOKEN
                type: string
        secrets:
            VAULT_ADDR:
                description: Vault server URL, used only by the failure notification.
                required: false
            VAULT_JWT_PATH:
                description: Vault auth backend path for GitHub OIDC (JWT) authentication, used only by the failure notification.
                required: false
            VAULT_JWT_ROLE:
                description: Vault role for GitHub OIDC (JWT) authentication, used only by the failure notification.
                required: false
            VAULT_JWT_AUDIENCE:
                description: GitHub OIDC audience for Vault (JWT) authentication, used only by the failure notification.
                required: false

permissions: {}

jobs:
    request:
        name: Request Copilot review
        if: >-
            (github.event.action == 'labeled' && github.event.label.name == 'ai-review') ||
            (contains(fromJSON('["opened", "ready_for_review"]'), github.event.action) &&
             !github.event.pull_request.draft &&
             !contains(fromJSON(inputs.skip-authors), github.event.pull_request.user.login))
        concurrency:
            group: >-
                ${{ github.event.action == 'labeled' && github.event.label.name != 'ai-review'
                    && format('{0}-ignored-{1}', github.workflow, github.run_id)
                    || format('{0}-{1}', github.workflow, github.event.pull_request.number) }}
            cancel-in-progress: true
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
            IS_LIVE: >-
                ${{ !startsWith(github.event.pull_request.head.ref, 'schedules/') }}
        permissions:
            issues: read # silence check of the failure notification
            # Callers run on `pull_request_target`, so a fork pull request gets an OIDC token here.
            # That is safe only while no step in this job checks out or runs pull request code:
            # never add a checkout step.
            id-token: write # Vault OIDC/JWT auth of the failure notification
            pull-requests: write
        steps:
            - name: Request Copilot review
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: gh api -X POST "repos/${REPO}/pulls/${PR}/requested_reviewers" -f 'reviewers[]=copilot-pull-request-reviewer[bot]' --silent

            - name: Notify Slack on failure
              if: failure() && inputs.slack-channel-id != 'none'
              uses: camunda/infraex-common-config/.github/actions/report-failure-on-slack@02306e482364266ddbf06978331076f5f7b4b687 # main
              with:
                  vault_addr: ${{ secrets.VAULT_ADDR }}
                  vault_jwt_path: ${{ secrets.VAULT_JWT_PATH }}
                  vault_jwt_role: ${{ secrets.VAULT_JWT_ROLE }}
                  vault_jwt_audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
                  vault_secret_path: ${{ inputs.vault-secret-path }}
                  vault_slack_token_key: ${{ inputs.vault-slack-token-key }}
                  slack_channel_id: ${{ inputs.slack-channel-id || (env.IS_LIVE == 'true' && 'C076N4G1162' || 'C07E4FF6YMB') }}
                  slack_mention_people: ${{ env.IS_LIVE == 'true' && '<!subteam^S0CBB7Y72SV>' || '' }}
                  disable_silence_check: ${{ env.IS_LIVE == 'true' && 'false' || 'true' }}
