---
name: AWS Scheduled Cleanup of test regions

on:
    schedule:
        # Single daily schedule at 5:00
        - cron: 0 5 * * *
    workflow_dispatch:
        inputs:
            region:
                description: AWS Region to clean up
                default: eu-west-2
            cleanup_older_than:
                description: Minimum age of the resources to cleanup
                default: 12h
    pull_request:
        paths:
            - .github/workflows/aws_nightly_cleanup.yml
            - .github/workflows/scripts/aws_global_cleanup.sh
            - .github/workflows/scripts/aws_global_db_teardown.sh
            - .github/workflows/scripts/aws_regional_cleanup.sh
            - .github/workflows/scripts/aws_route53_cleanup.sh

env:
    AWS_PROFILE: infraex
    # renovate: datasource=github-tags depName=gruntwork-io/cloud-nuke
    CLOUD_NUKE_VERSION: v0.52.0

# Limit workflow to a single execution per ref
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Single, sequential orchestrator for cross-region Aurora Global Database
    # teardown. It runs once, before the parallel per-region cleanup matrix, so
    # there is no race between region jobs and cloud-nuke sees standalone clusters.
    aws-global-db-teardown:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # Guarantees the pinned yq (.tool-versions) used by the region
            # derivation below, instead of relying on the runner image.
            - name: Install asdf tools
              uses: camunda/infraex-common-config/./.github/actions/asdf-install-tooling@26224a8e51a019dadec867d2c6413b81db1c4411 # 2.3.4

            - name: Determine DRY_RUN and matrix-derived regions
              env:
                  DISPATCH_REGION: ${{ github.event.inputs.region }}
              run: |
                  WF=".github/workflows/aws_nightly_cleanup.yml"

                  # Single source of truth: the regions wiped by this workflow are
                  # exactly its cleanup matrix, read straight from the YAML so the
                  # teardown safety guard can never drift from the matrix.
                  CLEANUP_REGIONS=$(yq '[.jobs.aws-cleanup.strategy.matrix.config[].region] | join(" ")' "$WF")
                  echo "CLEANUP_REGIONS=$CLEANUP_REGIONS" | tee -a "$GITHUB_ENV"

                  # Mirror the matrix run conditions for "active regions":
                  # - pull_request: dry-run over all regions (matches the matrix PR override)
                  # - workflow_dispatch: the single region selected via inputs (so a
                  #   manual run against e.g. us-east-1 still tears down its global DBs)
                  # - schedule: regions whose day is "All" or matches the current weekday
                  # yq joins directly (no `| paste`) so a yq failure can't be masked
                  # into an empty ACTIVE_REGIONS that would silently skip everything.
                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                      echo "DRY_RUN=true" | tee -a "$GITHUB_ENV"
                      ACTIVE_REGIONS="$CLEANUP_REGIONS"
                  elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      ACTIVE_REGIONS="$DISPATCH_REGION"
                  else
                      current_day=$(date +%A)
                      ACTIVE_REGIONS=$(yq "[.jobs.aws-cleanup.strategy.matrix.config[] | select(.day == \"All\" or .day == \"$current_day\") | .region] | join(\" \")" "$WF")
                  fi
                  echo "ACTIVE_REGIONS=$ACTIVE_REGIONS" | tee -a "$GITHUB_ENV"

            - name: Configure AWS CLI
              uses: camunda/camunda-deployment-references/./.github/actions/aws-configure-cli@66d8360fde057c0e4820dcd501dbbc325d9d60c1 # main
              with:
                  vault-addr: ${{ secrets.VAULT_ADDR }}
                  vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  aws-profile: ${{ env.AWS_PROFILE }}
                  aws-region: us-east-1

            - name: Tear down Aurora Global Databases
              timeout-minutes: 30
              run: .github/workflows/scripts/aws_global_db_teardown.sh

    aws-cleanup:
        runs-on: ubuntu-latest
        # Wait for the global-DB teardown so cloud-nuke sees standalone clusters,
        # but still run (best-effort) even if that teardown had issues.
        needs: aws-global-db-teardown
        if: ${{ !cancelled() }}
        strategy:
            fail-fast: false # don't propagate failing jobs
            matrix:
                # Define regions and types of cleanup based on day
                # Please also update the README.md of the project
                config:
                    - region: eu-west-2
                      day: All
                      cleanup_older_than: 12h
                    - region: eu-west-3
                      day: All
                      cleanup_older_than: 12h
                    # Third CI region, used by the multi-region reference
                    # architectures that need more than two regions to keep a
                    # Raft quorum.
                    - region: eu-central-2
                      day: All
                      cleanup_older_than: 12h
                    - region: eu-north-1
                      day: Saturday
                      cleanup_older_than: 0h
                    # Fourth region available to multi-region work, kept weekly so
                    # a topology can survive a work week.
                    - region: eu-south-1
                      day: Saturday
                      cleanup_older_than: 0h
                    - region: us-east-1
                      day: Saturday
                      cleanup_older_than: 0h
                    - region: us-east-2
                      day: Saturday
                      cleanup_older_than: 0h

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Determine AWS_REGION and CLEANUP_OLDER_THAN
              id: determine-values
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      AWS_REGION="${GITHUB_EVENT_INPUTS_REGION}"
                      CLEANUP_OLDER_THAN="${GITHUB_EVENT_INPUTS_CLEANUP_OLDER_THAN}"
                  else
                      AWS_REGION="${{ matrix.config.region }}"
                      CLEANUP_OLDER_THAN="${{ matrix.config.cleanup_older_than }}"
                  fi

                  echo "AWS_REGION=$AWS_REGION" | tee -a "$GITHUB_ENV"
                  echo "CLEANUP_OLDER_THAN=$CLEANUP_OLDER_THAN" | tee -a "$GITHUB_ENV"
              env:
                  GITHUB_EVENT_INPUTS_REGION: ${{ github.event.inputs.region }}
                  GITHUB_EVENT_INPUTS_CLEANUP_OLDER_THAN: ${{ github.event.inputs.cleanup_older_than }}

            - name: Check if job should run based on the day
              id: day-check
              run: |
                  # Initialize a variable to determine if the job should continue
                  should_run=true

                  # If it's a workflow_dispatch, only allow the first region (eu-west-2) of the matrix to run
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      if [[ "${{ matrix.config.region }}" != "eu-west-2" ]]; then
                          echo "Skipping job for this region because only the first region is allowed to run for workflow_dispatch."
                          should_run=false
                      else
                          echo "Running job for the first region only since it's a workflow_dispatch event."
                      fi
                  else
                      # Otherwise, check if the day matches the one in the matrix
                      current_day=$(date +%A)
                      if [[ "${{ matrix.config.day }}" != "All" && "${{ matrix.config.day }}" != "$current_day" ]]; then
                          echo "Skipping job for region ${{ env.AWS_REGION }} as it’s intended for ${{ matrix.config.day }} only."
                          should_run=false
                      else
                          echo "Running job for region ${{ env.AWS_REGION }} on the correct day: $current_day."
                      fi
                  fi

                  echo "should_run=$should_run" | tee -a "$GITHUB_ENV"

            # For PR purposes we're overwriting the setting and enable dry run
            - name: Set DRY_RUN for PR
              if: github.event_name == 'pull_request'
              run: |
                  echo "DRY_RUN=true" | tee -a "$GITHUB_ENV"
                  echo "CLOUD_NUKE_EXTRA_ARGS=--dry-run" | tee -a "$GITHUB_ENV"
                  echo "should_run=true" | tee -a "$GITHUB_ENV"

            - name: Import Secrets
              id: secrets
              if: ${{ env.should_run == 'true' }}
              uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
              with:
                  url: ${{ secrets.VAULT_ADDR }}
                  method: approle
                  roleId: ${{ secrets.VAULT_ROLE_ID }}
                  secretId: ${{ secrets.VAULT_SECRET_ID }}
                  exportEnv: false
                  secrets: |
                      secret/data/products/infrastructure-experience/ci/common AWS_ACCESS_KEY;
                      secret/data/products/infrastructure-experience/ci/common AWS_SECRET_KEY;
            - name: Configure AWS CLI
              if: ${{ env.should_run == 'true' }}
              uses: camunda/camunda-deployment-references/./.github/actions/aws-configure-cli@66d8360fde057c0e4820dcd501dbbc325d9d60c1 # main
              with:
                  vault-addr: ${{ secrets.VAULT_ADDR }}
                  vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  aws-profile: ${{ env.AWS_PROFILE }}
                  aws-region: ${{ matrix.config.region }}

            - name: Install Cloud Nuke
              if: ${{ env.should_run == 'true' }}
              run: |
                  curl -LO \
                    --retry 5 \
                    --max-time 15 \
                    --retry-delay 30 \
                    https://github.com/gruntwork-io/cloud-nuke/releases/download/${{ env.CLOUD_NUKE_VERSION }}/cloud-nuke_linux_amd64
                  chmod +x cloud-nuke_linux_amd64

            - name: Delete additional regional AWS resources
              timeout-minutes: 15
              if: ${{ env.should_run == 'true' }}
              run: .github/workflows/scripts/aws_regional_cleanup.sh "${{ env.AWS_REGION }}"

            # Runs before cloud-nuke, so the load balancers of the environment being
            # torn down tonight are still alive and their records are kept. cloud-nuke
            # removes those load balancers below, and tomorrow's run deletes the
            # records. Orphans therefore drain with a one-day lag, like the orphaned
            # target groups handled in aws_regional_cleanup.sh.
            - name: Delete orphaned Route53 records
              timeout-minutes: 20
              if: ${{ env.should_run == 'true' }}
              run: .github/workflows/scripts/aws_route53_cleanup.sh "${{ env.AWS_REGION }}"

            # this token is used to clone the github repository containing the base modules
            - name: Generate token for GitHub
              id: generate-github-token
              # Only run for the next step
              if: ${{ env.should_run == 'true' && env.AWS_REGION == 'eu-north-1' }}
              uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@787bec31b4ae6b70702321d0331676e88cfea9c5 # main
              with:
                  github-app-id-vault-key: GITHUB_APP_ID
                  github-app-id-vault-path: secret/data/products/infrastructure-experience/ci/common
                  github-app-private-key-vault-key: GITHUB_APP_PRIVATE_KEY
                  github-app-private-key-vault-path: secret/data/products/infrastructure-experience/ci/common
                  vault-auth-method: approle
                  vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID}}
                  vault-url: ${{ secrets.VAULT_ADDR }}
                  owner: camunda
                  repositories: infraex-terraform

            - name: Delete additional global AWS resources
              # Only run in a single time per week
              if: ${{ env.should_run == 'true' && env.AWS_REGION == 'eu-north-1' }}
              timeout-minutes: 45
              env:
                  GITHUB_TOKEN: ${{ steps.generate-github-token.outputs.token }}
              run: .github/workflows/scripts/aws_global_cleanup.sh

            # This is likely to fail, therefore we ignore the error via
            # `continue-on-error: true` (which also covers timeout-minutes
            # killing the step, unlike a shell-level `|| true`).
            # We're ignoring ec2-dhcp-option as they couldn't be deleted
            # cloudtrail is managed by IT and can't be deleted either
            # macie-member and ses-receipt-filter do not exist in every region
            # (Macie and SES receipt rules are not offered in eu-central-2, for
            # one), so cloud-nuke cannot list them there. We never create either,
            # so excluding them costs no coverage and keeps the enumeration check
            # below meaningful: it can then treat *any* listing failure as real.
            - name: Run Cloud Nuke (best-effort)
              timeout-minutes: 90
              continue-on-error: true
              env:
                  DISABLE_TELEMETRY: 'true'
              if: ${{ env.should_run == 'true' }}
              run: |
                  ./cloud-nuke_linux_amd64 aws ${{ env.CLOUD_NUKE_EXTRA_ARGS }} \
                  --region ${{ env.AWS_REGION }} \
                  --force \
                  --older-than ${{ env.CLEANUP_OLDER_THAN }} \
                  --exclude-resource-type ec2-dhcp-option \
                  --exclude-resource-type ec2-keypairs \
                  --exclude-resource-type guard-duty \
                  --exclude-resource-type macie-member \
                  --exclude-resource-type s3 \
                  --exclude-resource-type ses-receipt-filter \
                  --exclude-resource-type cloudtrail

            # The second run should remove the remaining resources (VPCs) and fail if there's anything left
            - name: Run Cloud Nuke (strict)
              timeout-minutes: 90
              env:
                  DISABLE_TELEMETRY: 'true'
              if: ${{ env.should_run == 'true' }}
              run: |
                  ./cloud-nuke_linux_amd64 aws ${{ env.CLOUD_NUKE_EXTRA_ARGS }} \
                  --region ${{ env.AWS_REGION }} \
                  --force \
                  --older-than ${{ env.CLEANUP_OLDER_THAN }} \
                  --exclude-resource-type ec2-dhcp-option \
                  --exclude-resource-type cloudtrail \
                  --exclude-resource-type ec2-keypairs \
                  --exclude-resource-type guard-duty \
                  --exclude-resource-type macie-member \
                  --exclude-resource-type s3 \
                  --exclude-resource-type ses-receipt-filter \
                  2>&1 | tee cloud-nuke-strict.log

            # cloud-nuke exits 0 when it cannot even *list* a resource type, so a
            # region we are no longer allowed to reach reports "Nothing to nuke,
            # you're all good!" and this job goes green while sweeping nothing.
            # A revoked IAM permission, an Organizations SCP, expired credentials,
            # a disabled region or a partial outage all produce that same silent
            # success, and whatever the sweep failed to delete keeps costing money
            # with nobody told. The strict run is meant to be the gate, so make it
            # actually gate.
            - name: Assert Cloud Nuke could enumerate resources
              if: ${{ env.should_run == 'true' }}
              run: |
                  # Both markers come from cloud-nuke's own per-resource-type report:
                  #   | vpc | Unable to retrieve vpc | vpc: failed to list resources in eu-central-2
                  if grep -nE 'failed to list resources|Unable to retrieve' cloud-nuke-strict.log; then
                      echo "::error title=Cloud Nuke could not enumerate resources in ${{ env.AWS_REGION }}::The sweep exited 0 but could not list the resource types reported above, so this region was not cleaned. Check the credentials, the IAM permissions and any Organizations SCP covering the region."
                      exit 1
                  fi

                  echo "cloud-nuke enumerated every resource type in ${{ env.AWS_REGION }}."

    notify-on-failure:
        runs-on: ubuntu-latest
        if: failure()
        needs:
            - aws-global-db-teardown
            - aws-cleanup
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Notify in Slack in case of failure
              id: slack-notification
              if: github.event_name == 'schedule'
              uses: ./.github/actions/report-failure-on-slack
              with:
                  vault_addr: ${{ secrets.VAULT_ADDR }}
                  vault_role_id: ${{ secrets.VAULT_ROLE_ID }}
                  vault_secret_id: ${{ secrets.VAULT_SECRET_ID }}
