---
# desc: publish a semver GitHub Release when the default branch has commits since the last published release
name: release-global

on:
    workflow_call:
        inputs:
            bump:
                description: Version part to bump, `patch`, `minor` or `major`.
                default: patch
                type: string
            dry-run:
                description: Compute the next version without publishing.
                default: false
                type: boolean
            app-token:
                description: >-
                    Create the release with the SMX - Misc App token from Vault instead of GITHUB_TOKEN.
                    Needed when a tag ruleset protects the release tags: GITHUB_TOKEN cannot bypass it.
                default: false
                type: boolean
            vault-secret-path:
                description: Vault path holding the GitHub App id and private key, used only with `app-token`. Callers outside InfraEx must use their own
                    App.
                default: secret/data/products/infrastructure-experience/ci/common
                type: string
            vault-github-app-id-key:
                description: Key of the GitHub App id in the Vault secret.
                default: GITHUB_APP_ID
                type: string
            vault-github-app-private-key-key:
                description: Key of the GitHub App private key in the Vault secret.
                default: GITHUB_APP_PRIVATE_KEY
                type: string
        secrets:
            VAULT_ADDR:
                description: Vault server URL, used only with `app-token`.
                required: false
            VAULT_JWT_PATH:
                description: Vault auth backend path for GitHub OIDC (JWT) authentication, used only with `app-token`. Optional; falls back to the `VAULT_JWT_PATH`
                    variable.
                required: false
            VAULT_JWT_ROLE:
                description: Vault role for GitHub OIDC (JWT) authentication, used only with `app-token`. Optional; falls back to the `VAULT_JWT_ROLE` variable.
                required: false
            VAULT_JWT_AUDIENCE:
                description: GitHub OIDC audience for Vault (JWT) authentication, used only with `app-token`. Optional; falls back to the `VAULT_JWT_AUDIENCE`
                    variable.
                required: false

# The caller grants `contents: write` when `app-token` is false, and `id-token: write` (Vault
# OIDC login) when it is true.
jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Check the caller grants id-token
              if: inputs.app-token
              run: |
                  if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
                      echo "::error::With app-token the calling job must grant 'permissions: id-token: write' for the Vault login."
                      exit 1
                  fi

            - name: Generate token for GitHub
              id: generate-github-token
              if: inputs.app-token
              uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@7b31f83bbaa79b0fe698d0b71cae0bc9189b7ac9 # main
              with:
                  github-app-id-vault-key: ${{ inputs.vault-github-app-id-key }}
                  github-app-id-vault-path: ${{ inputs.vault-secret-path }}
                  github-app-private-key-vault-key: ${{ inputs.vault-github-app-private-key-key }}
                  github-app-private-key-vault-path: ${{ inputs.vault-secret-path }}
                  vault-auth-method: jwt
                  vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH || vars.VAULT_JWT_PATH }}
                  vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE || vars.VAULT_JWT_ROLE }}
                  vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE || vars.VAULT_JWT_AUDIENCE }}
                  vault-url: ${{ secrets.VAULT_ADDR }}
                  owner: camunda
                  repositories: ${{ github.event.repository.name }}

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ steps.generate-github-token.outputs.token || github.token }}
                  GH_REPO: ${{ github.repository }}
                  BUMP: ${{ inputs.bump }}
                  BRANCH: ${{ github.event.repository.default_branch }}
                  DRY_RUN: ${{ inputs.dry-run }}
              run: |
                  set -euo pipefail

                  head=$(gh api "repos/${GH_REPO}/commits/${BRANCH}" --jq '.sha')

                  # Baseline: newest published (non-draft) semver release, so a draft left
                  # by a failed run is retried instead of counted as released.
                  last=$(gh release list --limit 50 --exclude-drafts --json tagName --jq '.[].tagName' \
                    | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
                  if [ -z "${last}" ]; then
                    echo "::error::No published semver release found to bump from."
                    exit 1
                  fi

                  ahead=$(gh api "repos/${GH_REPO}/compare/${last}...${head}" --jq '.ahead_by')
                  echo "${BRANCH} ${head} is ${ahead} commit(s) ahead of ${last}"
                  if [ "${ahead}" -eq 0 ]; then
                    echo "Nothing to release."
                    exit 0
                  fi

                  IFS=. read -r major minor patch <<< "${last}"
                  case "${BUMP}" in
                    major) next="$((major + 1)).0.0" ;;
                    minor) next="${major}.$((minor + 1)).0" ;;
                    patch) next="${major}.${minor}.$((patch + 1))" ;;
                    *)     echo "::error::Unknown bump '${BUMP}', expected patch, minor or major."; exit 1 ;;
                  esac
                  echo "Next release: ${next}"

                  if [ "${DRY_RUN}" = "true" ]; then
                    echo "Dry run, not publishing."
                    exit 0
                  fi

                  # gh release create reuses an existing tag instead of moving it to --target.
                  # matching-refs returns [] for an absent tag, so an API error fails the step.
                  tag_ref=$(gh api "repos/${GH_REPO}/git/matching-refs/tags/${next}" \
                    --jq ".[] | select(.ref == \"refs/tags/${next}\") | .ref")
                  # commits/<tag> peels annotated tags to their commit.
                  tag_sha=""
                  if [ -n "${tag_ref}" ]; then
                    tag_sha=$(gh api "repos/${GH_REPO}/commits/${next}" --jq '.sha')
                  fi
                  if [ -n "${tag_sha}" ] && [ "${tag_sha}" != "${head}" ]; then
                    echo "::error::Tag ${next} already exists at ${tag_sha}, not at ${BRANCH} ${head}."
                    exit 1
                  fi

                  # A draft left by an earlier run blocks gh release create: publish it if it targets head.
                  if draft_target=$(gh release view "${next}" --json isDraft,targetCommitish \
                    --jq 'select(.isDraft) | .targetCommitish' 2>/dev/null) && [ -n "${draft_target}" ]; then
                    if [ "${draft_target}" != "${head}" ]; then
                      echo "::error::Draft release ${next} targets ${draft_target}, not ${BRANCH} ${head}."
                      exit 1
                    fi
                    gh release edit "${next}" --draft=false --latest
                    exit 0
                  fi

                  gh release create "${next}" \
                    --target "${head}" \
                    --title "${next}" \
                    --generate-notes \
                    --notes-start-tag "${last}" \
                    --latest
