---
# Resources that IT deploys in every account through CloudFormation StackSets
# (MAP auto-tagging, Expel, Vigie, Wiz, DoiT). cloud-nuke must never delete them.
CloudFormationStack:
    exclude:
        names_regex:
            - ^StackSet-
            - ^stacksets-exec-
LambdaFunction:
    exclude:
        names_regex:
            - ^StackSet-
            - ^stacksets-exec-
CloudWatchLogGroup:
    exclude:
        names_regex:
            - ^StackSet-
            - ^stacksets-exec-
EventBridgeRule:
    exclude:
        names_regex:
            - ^StackSet-
            - ^stacksets-exec-
EventBridgeSchedule:
    exclude:
        names_regex:
            - ^StackSet-
            - ^stacksets-exec-
IAMRoles:
    exclude:
        names_regex:
            - ^StackSet-
            - ^stacksets-exec-
IAMPolicies:
    exclude:
        names_regex:
            - ^StackSet-
            - ^stacksets-exec-
